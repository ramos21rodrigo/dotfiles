source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 0
}

decoration {
  rounding = 10
         
  active_opacity = 1.05
  inactive_opacity = 1.05
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.4
  dim_special = 0.8

  blur {
  	enabled = true	
  	size = 6
  	passes = 2
  	ignore_opacity = true
  	new_optimizations = true
  	special = true
  }
}

