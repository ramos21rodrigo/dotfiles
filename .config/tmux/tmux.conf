set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'


set -g @plugin 'pwittchen/tmux-plugin-spotify'
set -g @plugin 'catppuccin/tmux#v2.1.1'
set -g @catppuccin_flavor 'macchiato'

set -g status-right-length 200
set -g status-left ""
set -g status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]#[noreverse]▷ "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #($HOME/.local/share/pipx/venvs/spotify-cli-linux/bin/spotifycli --song) "

set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_uptime}"


set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'


set -g @yank_with_mouse off
set -g @yank_action 'copy-pipe'
set -g set-clipboard on
set -g @override_copy_command 'xclip -i -selection clipboard'
set -g @yank_selection 'clipboard'
set -as terminal-features ',*:clipboard'

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi S-v send-keys -X rectangle-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

#set -g status-right '#{battery_status_bg} Batt: #{battery_icon} #{battery_percentage} #{battery_remain} "" | %a %h-%d %H:%M '
run '~/.tmux/plugins/tpm/tpm'
